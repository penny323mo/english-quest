name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Pillow for hero image tests
        run: python3 -m pip install --user pillow
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the artifact is built from this commit
        run: node scripts/verify-build.mjs
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: PWA update and 390px screenshots
        run: node e2e/run.mjs
      - name: Service worker migration stays within two reloads
        run: node e2e/migrate.mjs
      - name: Fresh iPhone Safari profile renders the light home
        run: node e2e/fresh-safari.mjs
      - name: Onboarding goal picks 今日 and opens its track at 390px in WebKit and Chromium
        run: node e2e/goal.mjs
        env:
          EQ_SHOTS: daily-shots
      - name: 每日抽卡 at 390px in WebKit and Chromium
        run: node e2e/daily.mjs
        env:
          EQ_SHOTS: daily-shots
      - name: Keep the onboarding, home and 每日抽卡 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: daily-shots/
          if-no-files-found: warn
      - name: Two tabs never overwrite each other's progress (WebKit and Chromium)
        run: node e2e/two-tabs.mjs
      - name: The microphone is never left on (WebKit and Chromium)
        run: node e2e/mic.mjs
      - name: Oldest service workers reach the light shell within two reloads
        run: node e2e/oldest.mjs
      - name: Full A1 lesson in WebKit and Chromium
        run: node e2e/full-lesson.mjs
      - name: Online opens the newest deploy, offline opens the kept copy
        run: node e2e/offline.mjs
