name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Pillow for hero image tests
        run: python3 -m pip install --user pillow
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the artifact is built from this commit
        run: node scripts/verify-build.mjs
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: PWA update and 390px screenshots
        run: node e2e/run.mjs
      - name: Service worker migration stays within two reloads
        run: node e2e/migrate.mjs
      - name: Fresh iPhone Safari profile renders the light home
        run: node e2e/fresh-safari.mjs
      - name: Oldest service workers reach the light shell within two reloads
        run: node e2e/oldest.mjs
      - name: Full A1 lesson in WebKit and Chromium
        run: node e2e/full-lesson.mjs

  asr:
    # Every clip a push or PR changes must say the text the learner sees.
    # The weekly run checks all of them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and faster-whisper
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install faster-whisper==1.2.1
      - name: Cache Whisper models and transcripts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .asr-cache.jsonl
          key: asr-${{ github.sha }}
          restore-keys: asr-
      - name: Choose the clips to check
        id: base
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=--all" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--changed ${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "args=--changed ${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--changed origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Clips say their text (Whisper base.en, rechecked with small.en)
        run: python scripts/asr_check.py ${{ steps.base.outputs.args }} --cache .asr-cache.jsonl --report asr-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-report
          path: asr-report.json
          if-no-files-found: ignore
