name: ci

on:
  push:
  pull_request:

jobs:
  audio-scope:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Compare with a previously accepted main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Last successful acoustic run before main acquired this gate (42845543840).
          base=096072948ac9c6577e1f2ac1345cec396c6550ac
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f branch=main -f event=push -f status=success -f per_page=40 --jq '.workflow_runs[].head_sha')
          for sha in $runs; do
            if git merge-base --is-ancestor "$sha" HEAD && git show "$sha:.github/workflows/ci.yml" | grep -F 'uses: ./.github/workflows/audio-asr.yml' > /dev/null; then
              base=$sha
              break
            fi
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"
          changed=false
          if ! git diff --quiet "$base" HEAD -- assets/audio content/lexicon.json content/lines.json 'content/word-audio*.json' scripts/check_audio_asr.py scripts/asr_selftest.py scripts/render_audio.py scripts/word_recordings.py scripts/audio-sources tests/fixtures/asr-known.json tests/fixtures/word-homophones.json .github/workflows/audio-asr.yml; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  acoustic:
    needs: audio-scope
    if: needs.audio-scope.outputs.changed == 'true'
    uses: ./.github/workflows/audio-asr.yml
    with:
      base_sha: ${{ needs.audio-scope.outputs.base }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Pillow for hero image tests
        run: python3 -m pip install --user pillow
      - name: Install ffmpeg for dictionary recording tests
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the artifact is built from this commit
        run: node scripts/verify-build.mjs
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: PWA update and 390px screenshots
        run: node e2e/run.mjs
      - name: Service worker migration stays within two reloads
        run: node e2e/migrate.mjs
      - name: Fresh iPhone Safari profile renders the light home
        run: node e2e/fresh-safari.mjs
      - name: Onboarding goal picks 今日 and opens its track at 390px in WebKit and Chromium
        run: node e2e/goal.mjs
        env:
          EQ_SHOTS: daily-shots
      - name: 每日抽卡 at 390px in WebKit and Chromium
        run: node e2e/daily.mjs
        env:
          EQ_SHOTS: daily-shots
      - name: Keep the onboarding, home and 每日抽卡 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: daily-shots/
          if-no-files-found: warn
      - name: Two tabs never overwrite each other's progress (WebKit and Chromium)
        run: node e2e/two-tabs.mjs
      - name: Review cards appear when due without reloading (WebKit and Chromium)
        run: node e2e/review-time.mjs
      - name: Invalid imports leave saved progress intact (WebKit and Chromium)
        run: node e2e/import-progress.mjs
      - name: The microphone is never left on (WebKit and Chromium)
        run: node e2e/mic.mjs
      - name: Only one sound plays at a time (WebKit and Chromium)
        run: node e2e/audio-overlap.mjs
      - name: A broken link opens the path (WebKit and Chromium)
        run: node e2e/bad-route.mjs
      - name: Onboarding (#27) with one tab saving at a time (#28), WebKit and Chromium
        run: node e2e/onboarding-tabs.mjs
      - name: The microphone works under React StrictMode (Vite dev server, WebKit and Chromium)
        run: |
          npx vite --port 5179 --strictPort --host 127.0.0.1 > vite-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5179/english-quest/ > /dev/null && break; sleep 1; done
          EQ_ORIGIN=http://127.0.0.1:5179/english-quest/ node e2e/mic.mjs
      - name: Bottom-right build stamp and 有新版本 (WebKit and Chromium)
        run: node e2e/version.mjs
      - name: Oldest service workers reach the light shell within two reloads
        run: node e2e/oldest.mjs
      - name: Offline A1 and course-wide answer keys in WebKit and Chromium
        run: node e2e/full-lesson.mjs
        env:
          EQ_FULL_OFFLINE: "1"
          EQ_WHOLE_COURSE: "1"
      - name: Online opens the newest deploy, offline opens the kept copy
        run: node e2e/offline.mjs
      - name: Recover a partially downloaded update with the previous lesson available offline
        run: node e2e/offline-update.mjs
