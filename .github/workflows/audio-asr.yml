name: audio-asr

# Listens to every clip whose text or mp3 changed in a pull request. A sentence
# clip (Whisper base.en) whose transcript differs from its text fails when it is
# also acoustically far from a fresh render of that text. A word-only clip
# (Whisper small.en, Kokoro voice) must be heard as its word or a reviewed
# homophone (see scripts/check_audio_asr.py).
on:
  pull_request:
    paths:
      - "content/lexicon.json"
      - "content/lines.json"
      - "assets/audio/**"
      - "scripts/check_audio_asr.py"
      - "tests/fixtures/asr-known.json"
      - "tests/fixtures/word-homophones.json"
      - "content/word-audio.json"
      - ".github/workflows/audio-asr.yml"

jobs:
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and sherpa-onnx
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          # Pinned: the word-clip gate was tuned on these builds, and a newer decoder can
          # hear a borderline take differently.
          python -m pip install sherpa-onnx==2.0.1 piper-tts==1.8.0 numpy
      - name: Cache Whisper models
        id: models
        uses: actions/cache@v4
        with:
          path: ~/asr-models
          key: sherpa-onnx-whisper-base.en-small.en-parakeet-tdt-0.6b-v2-piper-ljspeech-medium-kokoro-en-v0_19-v4
      - name: Download Whisper models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/asr-models && cd ~/asr-models
          for name in base.en small.en; do
            curl -sSL --retry 5 -o "$name.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-$name.tar.bz2"
            tar xjf "$name.tar.bz2" --wildcards '*int8.onnx' '*tokens.txt'
            rm "$name.tar.bz2"
          done
          curl -sSL --retry 5 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ljspeech-medium.tar.bz2" \
            | tar xj --wildcards '*/en_US-ljspeech-medium.onnx' '*/en_US-ljspeech-medium.onnx.json'
          # Word-only clips: Kokoro v0.19 (Apache-2.0).
          curl -sSL --retry 5 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-en-v0_19.tar.bz2" | tar xj
          # Parakeet rules on a word clip when Whisper only repeats the word.
          curl -sSL --retry 5 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2" \
            | tar xj --wildcards '*/encoder.int8.onnx' '*/decoder.int8.onnx' '*/joiner.int8.onnx' '*/tokens.txt'
      - name: Check changed clips (normal and slow)
        run: >-
          python scripts/check_audio_asr.py --models ~/asr-models
          --voice ~/asr-models/vits-piper-en_US-ljspeech-medium/en_US-ljspeech-medium.onnx
          --word-voice ~/asr-models/kokoro-en-v0_19
          --parakeet ~/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          --changed origin/${{ github.base_ref }} --slow
