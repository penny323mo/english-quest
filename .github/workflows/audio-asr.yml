name: audio-asr

# Listens to every clip whose text changed in a pull request and fails if
# two Whisper models both hear something other than the on-screen text.
on:
  pull_request:
    paths:
      - "content/lexicon.json"
      - "content/lines.json"
      - "assets/audio/**"
      - "scripts/check_audio_asr.py"
      - "tests/fixtures/asr-known.json"
      - ".github/workflows/audio-asr.yml"

jobs:
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and sherpa-onnx
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install sherpa-onnx numpy
      - name: Cache Whisper models
        id: models
        uses: actions/cache@v4
        with:
          path: ~/asr-models
          key: sherpa-onnx-whisper-base.en-small.en-v1
      - name: Download Whisper models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/asr-models && cd ~/asr-models
          for name in base.en small.en; do
            curl -sSL --retry 5 -o "$name.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-$name.tar.bz2"
            tar xjf "$name.tar.bz2" --wildcards '*int8.onnx' '*tokens.txt'
            rm "$name.tar.bz2"
          done
      - name: Check changed clips (normal and slow)
        run: python scripts/check_audio_asr.py --models ~/asr-models --changed origin/${{ github.base_ref }} --slow
