  <body>
    <div id="root"></div>
    <script>
      // eq-sw-kill-v1 runs before first paint. A page already controlled by this
      // worker stays hidden on a cream splash, then boots once. It does not
      // navigate to a cache-bust URL and does not reload again.
      window.__eqKill = (function () {
        function skipClaim() {
          try { sessionStorage.setItem("eq-skip-claim", "1"); } catch (e) {}
        }
        if (!("serviceWorker" in navigator)) return Promise.resolve();
        navigator.serviceWorker.addEventListener("message", function (event) {
          if (event.data && event.data.type === "eq-ping" && event.ports && event.ports[0]) {
            event.ports[0].postMessage({ eq: 2 });
          }
        });
        // A healthy worker answers as soon as it is running, but a cold start of
        // the large sw.js can take seconds on a slow phone. Only an old worker that
        // never answers (or answers wrongly) within 6 s is treated as dead. Waiting
        // costs nothing when the worker is healthy: it answers at once.
        var PING_MS = 6000;
        function ping() {
          var controller = navigator.serviceWorker.controller;
          if (!controller) return Promise.resolve(null);
          return new Promise(function (resolve) {
            var channel = new MessageChannel();
            var timer = setTimeout(function () { resolve(false); }, PING_MS);
            channel.port1.onmessage = function (event) {
              clearTimeout(timer);
              resolve(Boolean(event.data && event.data.eq === 2));
            };
            try { controller.postMessage({ type: "eq-ping" }, [channel.port2]); }
            catch (e) { clearTimeout(timer); resolve(false); }
          });
        }
        return ping().then(function (alive) {
          if (navigator.serviceWorker.controller && alive === false) {
            return navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).then(function () {
              var cleared = window.caches
                ? caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                  })
                : Promise.resolve();
              return cleared.then(function () {
                location.reload();
                return new Promise(function () {});
              });
            });
          }
          if (alive === true) skipClaim();
        }).catch(function () { skipClaim(); });
      })();
    </script>
