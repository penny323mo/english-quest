  <body>
    <div id="root"></div>
    <script>
      // One-time kill-switch for phones (especially a home-screen iOS PWA) that
      // still control the page with the pre-redesign worker. Runs before the app.
      window.__eqKill = (function () {
        var KEY = "eq-sw-kill-v1";
        function marked() {
          try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; }
        }
        function mark() {
          try { localStorage.setItem(KEY, "1"); } catch (e) {}
        }
        if (location.search.indexOf("eqfresh=1") !== -1) {
          try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
        }
        if (marked() || !("serviceWorker" in navigator)) {
          mark();
          return Promise.resolve();
        }
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          var controlled = Boolean(navigator.serviceWorker.controller);
          if (!regs.length && !controlled) {
            mark();
            return;
          }
          return Promise.all(regs.map(function (reg) { return reg.unregister(); })).then(function () {
            var cleared = window.caches
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                })
              : Promise.resolve();
            return cleared.then(function () {
              mark();
              location.reload();
              return new Promise(function () {});
            });
          });
        }).catch(function () { mark(); });
      })();
    </script>
